server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación enruta en el cliente: /tickets/12 no es un archivo, así que
    # cualquier ruta desconocida devuelve el index y React Router decide. Sin
    # esto, recargar en una vista de detalle daría un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que pueden cachearse para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
